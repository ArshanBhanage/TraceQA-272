[pytest]
# Pytest configuration for TraceQA E2E tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers
markers =
    e2e: End-to-end tests that require backend and frontend to be running
    integration: Integration tests that test multiple components together
    unit: Unit tests for individual components
    slow: Tests that take a long time to run (e.g., document processing)
    requires_api_keys: Tests that require API keys to be configured

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
